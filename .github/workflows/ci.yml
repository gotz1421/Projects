name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: Android build & unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to publish the APK as a release with a direct download link
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default ("tools platform-tools") fails: the legacy "tools" package is gone.
          packages: "platform-tools"

      - name: Install NDK + CMake (whisper.cpp + llama.cpp native modules)
        run: sdkmanager "ndk;25.1.8937393" "ndk;29.0.13113456" "cmake;3.22.1" "cmake;3.31.6"

      - name: Fetch vendored sherpa-onnx AAR (on-device Parakeet STT; gitignored binary)
        working-directory: android
        run: |
          mkdir -p app/libs
          curl -fSL --retry 3 -o app/libs/sherpa-onnx-static-link-onnxruntime-1.13.3.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.3/sherpa-onnx-static-link-onnxruntime-1.13.3.aar

      - name: Assemble debug + run unit tests
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon

      # The installable APK. Download it from the run's "Artifacts" section.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceFlow-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # A direct, phone-friendly download: the same APK attached to a fixed release, so
      # https://github.com/<repo>/releases/download/voiceflow-latest/VoiceFlow.apk always
      # serves the newest build (workflow artifacts need a desktop login and come zipped).
      - name: Rename APK for the release
        if: github.event_name == 'push' && github.ref == 'refs/heads/ccr-7c687cec-8yzxgu'
        run: cp android/app/build/outputs/apk/debug/*.apk VoiceFlow.apk

      - name: Publish APK as the latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/ccr-7c687cec-8yzxgu'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: voiceflow-latest
          name: VoiceFlow (última versión)
          make_latest: true
          files: VoiceFlow.apk
          body: |
            Última versión de VoiceFlow, compilada desde la rama ccr-7c687cec-8yzxgu (commit ${{ github.sha }}).
            Descarga VoiceFlow.apk e instálalo encima de la versión anterior.
